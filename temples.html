<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Temples Album</title>

<body>
<header>
    <div class="header-bar">
        <span>Temple Album</span>
        <button id="menu" aria-label="Menu"></button>
    </div>
    <nav>
        <ul>
            <li><a href="#">Home</a></li>

    <main>
        <h1>Home</h1>
        <div class="gallery"> <!-- a wrapper makes grid/flex layout much easier -->
            <figure>
                <img src="images/temple.webp" alt="San Diego California Temple" loading="lazy">

            </figure>
            <figure>
                <img src="images/temple2.webp" alt="Salt Lake City Utah Temple" loading="lazy">

            <figure>
                <img src="images/temple3.webp" alt="Rome Italy Temple" loading="lazy">

                <img src="images/temple4.webp" alt="London England Temple" loading="lazy">

            <figure>
                <img src="images/temple5.webp" alt="Tokyo Japan Temple" loading="lazy">

            </figure>
            <figure>
                <img src="images/temple6.webp" alt="Mexico City Mexico Temple" loading="lazy">
                <figcaption>Mexico City Mexico</figcaption>    
            </figure>
            <figure>

            </figure>
            <figure>

            <figure>    
                <img src="images/temple9.webp" alt="St. George Utah Temple" loading="lazy">
                <figcaption>St. George Utah</figcaption>

    </main>
    <footer>
        <p>&copy;<span id="currentyear"></span> Gabriel Awushie - Tetteh Ghana</p>
